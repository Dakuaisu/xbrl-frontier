name: scorer-oracles
on:
  push:
    paths: ["xbrl_frontier/**", "tests/**", "docs/config/thresholds.yaml", "requirements*.txt", "requirements.lock"]
  pull_request:
    paths: ["xbrl_frontier/**", "tests/**", "docs/config/thresholds.yaml", "requirements*.txt", "requirements.lock"]
jobs:
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/python -m pytest -q tests/test_scorer_unit.py tests/test_oracles.py
