name: scorer-oracles
on:
  workflow_dispatch:
  push:
    paths: ["xbrl_frontier/**", "scripts/score_predictions.py", "tests/**", "docs/config/thresholds.yaml", "requirements*.txt", "requirements.lock", ".github/workflows/**"]
  pull_request:
    paths: ["xbrl_frontier/**", "scripts/score_predictions.py", "tests/**", "docs/config/thresholds.yaml", "requirements*.txt", "requirements.lock", ".github/workflows/**"]
jobs:
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .venv/bin/python -m pytest -q tests/test_scorer_unit.py tests/test_oracles.py tests/test_score_predictions.py tests/test_bio.py
