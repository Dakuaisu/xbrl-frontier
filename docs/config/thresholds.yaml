# Single source of truth for every numeric gate, pin, seed and budget in PRD.md.
# The PRD names these keys and never restates their values. Change values here, not in prose.
# Empty revision/sha fields are filled at pin time (Phase 0) and never edited afterwards.
schema_version: "2026-10-01.v2.2-frozen"   # v2: $10 cap, no rented GPUs, FinNI only, 0.6B/1.7B students, T4 + RTX 3050 serving; v2.1: cost gate, sampling, decision rule, fresh control, smoke test

pins:
  eval_finni:        { repo: "TheFinAI/FinNI-eval-v2", split: "test", rows_expected: 28787, hf_revision: "e3e0aba23b5c3df17a71c8c013030182d013a538" }
  eval_manifest:     "data/eval_manifest.csv"          # CIK, accession, filing date for all 142 FinTagging eval filings
  eval_instance_map: "data/eval_instance_to_filing.csv" # every eval instance id -> accession (needed for bootstrap over filings)
  train_accessions:  "data/train_accessions.txt"       # pinned accession list; never a date window relative to today
  fresh_accessions:  "data/fresh_accessions.txt"       # post-cutoff slice, pinned the same way
  students:
    - { id: "Qwen/Qwen3-0.6B", hf_revision: "c1899de289a04d12100db370d81485cdf75e47ca" }
    - { id: "Qwen/Qwen3-1.7B", hf_revision: "70d244cc86ccca08cf5af4e1e306ecf908b1ad5e" }       # primary
  encoder_baseline:  { id: "nlpaueb/sec-bert-base", hf_revision: "d511591f5e74052afdab08f1f14c4ff2a1e55749" }
  frontier_arms:     # zero-shot only; dateless Anthropic/Google ids are pinned snapshots per vendor docs; OpenAI dated snapshot used
    - "gpt-6-luna"                   # cheapest arm
    - "gemini-3.5-flash-lite"        # second vendor, cheap
    - "gpt-5.4-mini-2026-03-17"      # mid-tier accuracy anchor
  arm_swap_if_over_budget: { replace: "gpt-5.4-mini-2026-03-17", with: "gpt-5.4-nano-2026-03-17" }
  seeds:             [ 1, 2 ]                          # primary student only; the 0.6B student runs seed 1
  software:          { vllm: "0.30.0", mlx_lm: "0.32.0", transformers: "5.18.0", peft: "0.21.2", trl: "", unsloth: "", autoawq: "0.2.9", llmcompressor: "0.14.0", guidellm: "", bitsandbytes: "0.50.2", accelerate: "1.15.0" }   # vllm/autoawq/llmcompressor pinned 2026-10-02 (owner, O-007); transformers/peft/bitsandbytes/accelerate 2026-10-02 (owner, O-020, T-019); others pinned when their phase first installs them
  price_sheet:       "config/prices_2026-10-01.yaml"
  fintagging_source:                                  # benchmark serializer + taxonomy (added 2026-10-02, TRADEOFFS T-009)
    repo: "The-FinAI/FinTagging"
    commit: "653650cbbab525227d20228c94a65600c1209c01"  # parse_xbrl_report.ipynb ported to ixbrl_facts/fintagging.py
    taxonomy_xsd:                                     # union of element types = the paper's 17,688 concepts; later year wins
      - { url: "https://xbrl.fasb.org/us-gaap/2023/elts/us-gaap-2023.xsd", sha256: "5b23edf9ea3f1a6e35a50214e72d8a21acc2c262c6490d606a72cee0c3fb342e" }
      - { url: "https://raw.githubusercontent.com/The-FinAI/FinTagging/653650cbbab525227d20228c94a65600c1209c01/taxonomy/us-gaap-2024.xsd", sha256: "6a5daf96dc96edf69876ac9a34a3cb076f23eec3e2899e88ae92c1cecae0d70f" }
  filingqa_fork:     { path: "/Users/apple/FillingQA", commit: "895bf6d7d1b4c94254c64b378d02c349d1e7399b", forked: [ "api/parse/ixbrl.py::harvest_dei" ] }   # no runtime dependency

eval:
  dedup_policy:                 "exact_context_and_answer"   # report raw and deduplicated; headline uses deduplicated
  aggregation:                  "global_pairs"               # pooled TP/FP/FN over all instances; per-instance mean also reported
  value_normalization:          "fintagging_prompt_rules"    # strip $ % , ; no magnitude expansion; lowercase word numbers
  bootstrap_resamples:          1000
  ci_level:                     0.95
  paired_bootstrap:             true                         # student-minus-frontier difference resampled per filing on the shared sample
  bootstrap_seed:               20261010                     # company-cluster resampling (T-007; added 2026-10-02, TRADEOFFS T-028)
  generation:                   { max_model_len: 32768, temperature: 0.0 }   # student scoring with vLLM (added 2026-10-02, TRADEOFFS T-021); prompts beyond max_model_len are scored empty and counted
  slices:                       [ "context_type", "entity_type", "company", "fiscal_year", "context_token_bucket", "train_size_point" ]
  context_token_bucket_edges:   [ 76, 410 ]              # terciles of context tokens over the 25969 dedup instances; Qwen/Qwen3-1.7B@70d244cc86cc tokenizer (identical in both students); edge k = sorted[floor(k*n/3)]; scripts/derive_token_bucket_edges.py
  oracles:
    gold_copy_f1:               1.0
    empty_prediction_f1:        0.0
    gold_with_types_swapped_f1: 0.0
    gold_half_dropped_recall:   0.5
    tolerance:                  0.0005
  label_audit:
    sample_size:                300
    second_pass_size:           100                          # re-checked a week later by the same person for self-agreement
    stratify_by:                [ "context_type", "entity_type" ]
    min_self_agreement:         0.90
    seed:                       20261011                     # first-pass draw (added 2026-10-02, TRADEOFFS T-029)
    second_pass_seed:           20261012                     # second-pass subset (T-029)

frontier:                    # all $ figures priced from pins.price_sheet, batch endpoints for accuracy, sync for latency
  sample_filings:            23                               # default; recomputed from the probe, see PRD section 7
  stratify_by:               [ "table_share_tercile", "instances_per_filing_tercile" ]   # 3 x 3 cells, 2-3 filings each
  balance_check:             [ "sector" ]                      # reported against the manifest; redraw if a sector with > proportional share is empty
  fresh_slice_control_arm:   "gemini-3.5-flash-lite"          # zero-shot on the full fresh slice; was gpt-6-luna, changed per owner decision T-033 item 3 (no key for gpt-6-luna)
  running_arms:              [ "gemini-3.5-flash-lite" ]      # T-033: the only arm with a key ($0 billed, free tier); pins.frontier_arms stays the planned design, the others are not run (README discloses)
  free_tier:                                                  # Gemini free-tier collection (T-033, TRADEOFFS T-034)
    policy:                  "T-033"
    api_key_env:             "GEMINI_API_KEY"
    batch_api:               false                            # Batch API quota tables list paid tiers only; refused as potentially billable
    assumed_rpm:             10                               # starting pace until a 429 reports the real limit (docs give no free-tier numbers; no rate-limit headers)
    backoff_seconds:         [ 5, 15, 60, 300 ]               # 429 without a retryDelay and 5xx; then the run stops with the instance still pending
    daily_reset_tz:          "America/Los_Angeles"            # RPD resets at midnight Pacific (rate-limits page)
  probe_filings:             1                                # per arm, synchronous, to measure real tokens before committing
  reasoning_token_margin:    0.15                             # multiplier on the batch estimate for thinking/retry overhead
  sync_latency_instances:    100                              # fixed ids, same for every arm and student
  sync_runs:                 3
  thinking:                  "minimum_the_api_allows"         # set per vendor; recorded in the run log
  thinking_per_arm:                                           # the minimum each API allows; a live call needs a verified source (TRADEOFFS T-024, T-025)
    gpt-6-luna:              { api: "openai_responses", reasoning_effort: "none", source: "developers.openai.com/api/docs/guides/latest-model, checked 2026-10-02: 'GPT-6 Sol and GPT-6 Luna support none'" }
    gemini-3.5-flash-lite:   { api: "gemini_generate_content", thinking_level: "minimal", source: "docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-5-flash-lite, checked 2026-10-02: '3.5 Flash-Lite defaults to minimal thinking'" }
    gpt-5.4-mini-2026-03-17: { api: "openai_responses", reasoning_effort: "none", source: "developers.openai.com/api/docs/models/gpt-5.4-mini, checked 2026-10-02: 'Reasoning.effort supports: none (default)'" }
    gpt-5.4-nano-2026-03-17: { api: "openai_responses", reasoning_effort: "none", source: "" }   # swap candidate; UNVERIFIED (set by analogy), live calls refused until a source is recorded
  usd_reserve_min:           1.00                             # must remain unspent after the plan is priced
  sampling:                  { seed: 20261007, max_redraws: 100, sector_key: "sec_office" }   # frontier sample draw (added 2026-10-02, TRADEOFFS T-026); sector = SEC office as in T-011
  latency_sampling:          { seed: 20261008, rule: "uniform without replacement over the deduplicated assigned instances of the frontier sample filings" }   # T-026
  probe_selection:           { seed: 20261009, rule: "one filing per arm, uniform over non-sample manifest filings in the middle instances-per-filing tercile" }   # T-026
  power_check:                                                # run after the primary student's full-set run, before the probe
    sd_source:               "primary student between-filing F1 SD on the deduplicated full set (proxy for the paired SD)"
    expected_half_width:     "1.96 * sd / sqrt(sample_filings)"
    must_not_exceed_key:     "gates.headline_margin_f1"
    if_exceeded:             "drop pins.frontier_arms[2]; sample_filings = largest N whose priced plan (remaining arms, their probe and sync costs, fresh control, reasoning margin) leaves usd_reserve_min; headline becomes 'fraction of the best remaining arm'"

contamination:
  eval_manifest_required_recovered: 142
  instance_assignment_min_fraction: 0.95                      # share of eval instances mapped to a filing; the rest form an "unassigned" stratum
  train_filing_date_max:            "2023-02-12"             # strictly before the FinTagging eval window
  exclude_ciks_from:                [ "data/eval_manifest.csv", "research/edgar_submissions_train10.json", "data/eval_cik_candidates_unconfirmed.txt" ]   # third file added 2026-10-02 (TRADEOFFS T-008)
  ngram_n:                          13
  max_flagged_train_docs_after_removal: 0
  minhash_num_perm:                 128
  minhash_jaccard_threshold:        0.8
  minhash_shingle_words:            5                         # word 5-gram shingles (Lee et al. 2022 dedup); added 2026-10-02, TRADEOFFS T-014
  minhash_seed:                     20261004                  # permutation parameters; added 2026-10-02, TRADEOFFS T-014
  fresh_slice_min_filings:          30
  fresh_slice_filing_date_min:      "2026-05-19"             # = max knowledge cutoff among pinned frontier arms + 1 day; filled at pin time (2026-10-02): gpt-6-luna 2026-05-18 is the latest (TRADEOFFS T-015)
  frontier_arm_cutoffs:                                       # knowledge cutoffs behind fresh_slice_filing_date_min (vendor docs, checked 2026-10-02; T-015)
    gpt-6-luna:              { cutoff: "2026-05-18", source: "developers.openai.com/api/docs/models/gpt-6-luna: 'May 18, 2026 knowledge cutoff'" }
    gpt-5.4-mini-2026-03-17: { cutoff: "2025-08-31", source: "developers.openai.com/api/docs/models/gpt-5.4-mini: 'Aug 31, 2025 knowledge cutoff'" }
    gemini-3.5-flash-lite:   { cutoff: "2026-03", source: "deepmind.google/models/model-cards/gemini-3-5-flash-lite: 'knowledge cutoff ... March 2026'" }
  fresh_slice_selection:            { filing_date_max: "2026-10-02", forms: [ "10-K" ], seed: 20261005 }   # selection date is the upper bound; same strata as training (added 2026-10-02, T-015)
  eval_filing_window_end:           "2025-02-13"             # FinTagging v5: 142 10-Ks filed 2023-02-13..2025-02-13; start = train_filing_date_max + 1 day (added 2026-10-02, TRADEOFFS T-003)
  instance_match:                                             # instance -> filing assignment (added 2026-10-02, TRADEOFFS T-003)
    shingle_words:               8                            # word n-gram size over lowercased [a-z0-9]+ tokens
    max_shingles_per_context:    64                           # evenly spaced sample per context
    fuzzy_min_containment:       0.5                          # share of a context's sampled shingles found in the filing
    min_unique_exact_for_filing: 3                            # a filing is in the eval set if this many contexts match it, and no other scanned filing, exactly

edgar:                       # SEC fair-access (added 2026-10-02, TRADEOFFS T-003)
  max_requests_per_second:   8                                # SEC ceiling is 10/s; stay under it
  fts_query_budget:          2000                             # PRD section 9 estimate for manifest completion
  fts_phrase_words:          11                               # PRD section 4 recipe
  retry_backoff_seconds:     [ 2, 10, 60 ]                    # on 429/5xx only; a 403 stops the run (OWNER-BLOCKED)

training:
  target_train_instances:    40000                            # sized to the Kaggle quota, see PRD section 9
  negatives_fraction:        0.40                             # FinTagging v5 ratio is ~0.43 (12,310 / 28,787)
  curve_points:              [ 2500, 5000, 10000, 20000, 40000 ]   # nested prefixes of one shuffled order; checkpoints at these example counts
  curve_lr_schedule:         "constant"                       # so checkpoints are comparable; the final run may decay
  curve_validation_run:      10000                            # one independent run at this size to check the nested-checkpoint curve
  dev_slice_instances:       2000                             # held-out training-corpus slice used to score curve checkpoints cheaply
  accession_selection:                                        # pins.train_accessions, selected once (added 2026-10-02, TRADEOFFS T-011)
    filing_date_min:         "2021-02-13"                     # two-year window ending at contamination.train_filing_date_max, mirroring the eval window's length
    form_share:              { "10-K": 0.5, "10-Q": 0.5 }     # PRD section 4 names both forms; no ratio given
    max_filings_per_cik:     1
    strata:                  [ "sec_office", "filer_size" ]   # target = the eval manifest's distribution over these cells
    seed:                    20261002
    frozen_rows:             { count: 208, sha256: "71440ef5e3534d24ff66f745fb8c7c6ae06130a11dd20e01881d29b4e392d5a7" }   # data rows (after the column header) of the initial selection; --extend verifies them (T-012)
    extension_margin:        0.10                             # extension sized to the positive need x (1 + margin), from measured per-form yields (T-012)
  corpus_sampling:                                            # sampled training corpus (added 2026-10-02, TRADEOFFS T-013)
    seed:                    20261003
  epochs:                    2
  lora_rank:                 16
  lora_alpha:                32
  learning_rate:             1.0e-4
  lora_dropout:              0.0                              # added 2026-10-02 (TRADEOFFS T-017)
  lora_target_modules:       [ "q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj" ]   # every linear projection in every layer (T-017)
  global_batch_instances:    16                               # instances per optimizer step on every machine (T-017)
  kaggle:
    max_seq_len_tokens:      4096
    dtype:                   "fp16"                           # T4 has no bf16
    quant_base:              "nf4"                            # QLoRA via bitsandbytes
    session_hours_max:       12
    weekly_gpu_hours_quota:  30
    gpu_hours_cap_total:     70
    checkpoint_every_minutes: 30                              # resume across sessions
    micro_batch:             1                                # per-step instances; grad accumulation = global_batch_instances / micro_batch (T-017)
  mac:
    pilot_instances:         3000
    max_seq_len_tokens:      2048
    quant_base:              "4bit"                           # mlx-lm QLoRA
    min_tokens_per_sec_to_train_0p6b_locally: 1500            # measured in the pilot; below this the 0.6B also trains on Kaggle
    micro_batch:             1                                # T-017; 4 ran out of Metal memory at 2,048 tokens on 16 GB (first pilot attempt)
    grad_checkpoint:         true                             # T-017; needed for 2,048-token sequences on 16 GB
    quant_group_size:        64                               # mlx_lm.convert default, recorded (T-017)
    pilot_val_instances:     200                              # first dev-slice instances that fit, for pilot val loss and a format check (T-017)
  encoder:                                                    # SEC-BERT token-classification baseline (added 2026-10-02, TRADEOFFS T-020)
    label_space:             { url: "https://raw.githubusercontent.com/The-FinAI/FinTagging/653650cbbab525227d20228c94a65600c1209c01/BERT/data/label2id.json", sha256: "06ad30b706fbfd51fff47bf5ecad276ae5b51f085ace791e814e137b14166a35" }   # the benchmark's BIO label space (34,777 labels)
    window_subtokens:        512                              # model max_position_embeddings; contexts are chunked, never truncated
    epochs:                  3                                # PRD section 5 ("three epochs")
    learning_rate:           5.0e-5                           # FinTagging BERT/train_ner_model.py default
    micro_batch:             4                                # FinTagging BERT/train_ner_model.py default
  planning_tokens_per_sec:   { t4_qlora_1p7b: 1500, t4_qlora_0p6b: 3000 }   # planning assumptions only; replaced by pilot measurements

serving:
  hardware:
    kaggle_t4:
      gpu: "NVIDIA T4 16GB"
      sm: 7.5
      dtype: "fp16"
      variants: [ "fp16", "int8-w8a8", "awq-int4" ]           # natively supported on Turing; FP8 is not
      market_rate_keys:                                        # dated sources in config/prices_2026-10-01.yaml; first is the headline, all shown as sensitivity
        - "gpu_per_hour.modal.T4"
        - "gpu_per_hour.huggingface_endpoints.T4"
        - "gpu_per_hour.aws.g4dn_xlarge_T4"                   # blank in the sheet until observed at pin time; dropped if still blank
      load_generator_colocated: true                          # GuideLLM in the same notebook; network excluded and stated
    rtx3050_wsl2:
      gpu: "NVIDIA RTX 3050 Laptop 4GB"
      sm: 8.6
      dtype: "bf16"
      variants: [ "0.6B-bf16", "0.6B-awq-int4", "1.7B-awq-int4" ]   # 1.7B bf16 weights alone are 3.4 GB and do not fit
      vllm_flags: { enforce_eager: true, max_model_len: 4096, gpu_memory_utilization: 0.95, max_num_seqs: 8 }
      cost_label: "owned hardware; latency and throughput only; no $ per filing is reported"
  concurrency_levels:        { kaggle_t4: [ 1, 4, 16 ], rtx3050_wsl2: [ 1, 4 ] }
  request_rate_sweep_rps:    [ 0.25, 0.5, 1, 2, 4 ]
  warmup_requests:           20
  requests_per_point:        200
  slo:
    ttft_p95_ms:             500
    e2e_p95_ms:              2000
  utilization_scenarios:     [ 0.10, 0.50, 0.90 ]
  load_test:                 { tool: "vllm bench serve", max_output_tokens: 4096, prompts: "data/frontier_latency_ids.txt" }   # Phase 4 (added 2026-10-02, TRADEOFFS T-027): per-request output cap (generation stops at EOS first); prompts = the pinned latency ids
  frontier_latency_vantage:  "mac_home_network"               # network included and stated
  phase0_throughput_benchmark:                               # before any training; base models, vLLM fp16, FinNI token shape
    models:                  [ "Qwen/Qwen3-0.6B", "Qwen/Qwen3-1.7B" ]
    input_tokens:            1100
    output_tokens:           175
    concurrency_levels:      [ 1, 4, 16 ]
    requests_per_point:      200
    report:                  [ "max_throughput_filings_per_hour", "goodput_filings_per_hour_at_slo", "break_even_goodput_per_arm_per_regime", "gate_pass_goodput_per_arm_per_regime" ]
    break_even:              "t4_rate / (arm $/filing at the regime price * regime utilization)"
    gate_pass_goodput:       "gates.cost_ratio_vs_comparator_min * break_even"
  smoke_test:                                                # Phase 0; one generation plus a short throughput check per variant per card
    required:                true
    cards:                   [ "kaggle_t4", "rtx3050_wsl2" ]
    variants:                "all planned variants of serving.hardware.<card>.variants, using base-model checkpoints quantized the same way"
    requests_per_variant:    20
    failure_action:          "remove the variant from the serving table before training hours are spent; record the error"
    smoke_quantization:                                      # base-model checkpoints for the smoke test only; never scored (added 2026-10-02, TRADEOFFS T-004)
      int8_w8a8:             { tool: "llmcompressor", scheme: "W8A8", calibration: "none (dynamic per-token activations)" }
      awq_int4:              { tool: "autoawq", w_bit: 4, q_group_size: 128, zero_point: true, version: "GEMM",
                               calib_data: "pileval", calib_samples: 128, calib_max_seq_len: 512 }   # AutoAWQ defaults; Phase 2 re-calibrates on training contexts
  export_quantization:                                       # Phase 2 export of trained students (added 2026-10-02, TRADEOFFS T-023); schemes and tools as smoke_quantization
    awq_calibration:         { source: "data/corpus/train.jsonl", samples: 128, seed: 20261006, max_seq_len: 512 }   # fixed seeded sample of training instances rendered as prompt + answer


gates:                       # the minimum defensible version ships only if every gate passes
  finni_f1_fraction_of_best_frontier_min:  0.90               # on the shared frontier sample, paired bootstrap
  finni_f1_gain_over_zero_shot_min:        0.30               # absolute, same base model
  quantized_f1_drop_max:                   0.02
  quantized_flip_rate_max:                 0.05
  headline_margin_f1:                      0.03               # the smallest distance from the headline threshold the design must resolve; drives frontier.power_check
  cost_ratio_vs_comparator_min:            3.0                # T4 headline rate, gated regime below
  cost_comparator_rule:                                       # which frontier arm the cost ratio is taken against
    primary:   "cheapest arm whose F1 point estimate lies within the student's bootstrap CI on the shared sample"
    fallback_1: "if no arm lies within the CI, the cheapest arm whose F1 is above the CI"
    fallback_2: "if no arm is within or above the CI, the cheapest arm overall, and the result is labelled 'student dominates on quality'"
  cost_gate_regime:                        "offline"          # the other regime is reported with the same rule, not gated
  cost_regimes:
    offline: { frontier_price: "batch", self_host_denominator: "max_throughput_filings_per_hour", utilization: 0.90 }
    online:  { frontier_price: "sync",  self_host_denominator: "goodput_filings_per_hour_at_slo", utilization: 0.50 }
  pareto_chart_required:                   true               # F1 vs $/filing, every arm and serving variant, both regimes
  fresh_slice_f1_gap_max:                  0.05
  fresh_slice_control_gap_reported:        true               # student gap next to the control arm's gap and their difference
  decision_rule:                                              # applies to every gate that rests on a bootstrap statistic
    statistic:    "paired_bootstrap_point_estimate"
    pass:         "point_estimate meets threshold AND the whole CI meets it"
    fail:         "point_estimate misses threshold AND the whole CI misses it"
    inconclusive: "CI straddles the threshold, whichever side the point estimate is on; ships labelled, without the claim"
    ci_level_key: "eval.ci_level"
  encoder_baseline_reported:               true
  learning_curve_reported:                 true

budget:
  usd_cap_total:         10
  usd_cap_frontier_api:  10
  usd_cap_gpu:           0                                    # no rented GPUs
  hours_cap_total:       90
